[package]
authors = ["Brendan C. Ward"]
name = "rastertiler"
description = "Render a single-band GeoTIFF to MBTiles"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossbeam = "0.8"
# gdal = { git = "https://github.com/georust/gdal.git" }
# gdal-sys = { git = "https://github.com/georust/gdal.git", features = [
#     'bindgen',
# ] }
gdal = "0.19"
gdal-sys = "0.12"
hex = "0.4"
png = "0.18"
indicatif = "0.18"
itertools = "0.15"
libc = "0.2"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite = "0.40"
seahash = "4.1"

[dev-dependencies]
rstest = "0.27"

[profile.dev.package.png]
opt-level = 3

[profile.dev]
panic = "abort"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
